<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ongoing Theory</title>
  <meta name="description" content="Brand and story as growth infrastructure. Ben Forman, Auckland, New Zealand.">
  <meta name="theme-color" content="#0a0d14">

  <!-- SVG first for anything modern, PNG for the rest, 180px for iOS -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- absolute URLs and a JPG: most social scrapers won't follow a relative
       path and several still won't render WebP -->
  <meta property="og:site_name" content="Ongoing Theory">
  <meta property="og:title" content="Ongoing Theory">
  <meta property="og:description" content="Brand and story as growth infrastructure. Ben Forman, Auckland, New Zealand.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ongoingtheory.com/">
  <meta property="og:image" content="https://ongoingtheory.com/assets/share.jpg">
  <meta property="og:image:secure_url" content="https://ongoingtheory.com/assets/share.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A corner office at dusk, looking out over the Auckland skyline">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ongoing Theory">
  <meta name="twitter:description" content="Brand and story as growth infrastructure. Ben Forman, Auckland, New Zealand.">
  <meta name="twitter:image" content="https://ongoingtheory.com/assets/share.jpg">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="viewport" id="viewport">

    <!-- everything that moves with the room -->
    <div class="parallax" id="parallax">
      <div class="stage" id="stage">
        <img class="scene" id="scene" src="assets/office.webp" alt="A corner office at dusk, looking out over the Auckland skyline">
        <canvas class="twinkle" id="twinkle" aria-hidden="true"></canvas>
        <div class="grade" aria-hidden="true"></div>
        <!-- practical lights, each breathing on its own clock -->
        <div class="glows" aria-hidden="true">
          <span class="glow glow--desk"></span>
          <span class="glow glow--floor"></span>
          <span class="glow glow--corner"></span>
          <span class="glow glow--wash"></span>
        </div>
        <!-- grain and vignette sit above the room but below the cards, so a
             sheet of paper never picks up the room's texture -->
        <div class="grain" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>

        <div class="hotspots" id="hotspots"></div>
      </div>
    </div>

    <!-- the only overlay: a hint that fades out as soon as you find something -->
    <p class="hint" id="hint">
      <span class="hint__dot" aria-hidden="true"></span><span id="hinttext">Look around the room</span>
    </p>

    <!-- shown only when the room is wider than the window -->
    <button class="pan pan--left" id="pan-left" type="button" aria-label="Look left">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 5L8 12l7 7" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="pan pan--right" id="pan-right" type="button" aria-label="Look right">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- the reading window, for anything too long for a card -->
    <div class="reader" id="reader" hidden>
      <div class="reader__backdrop" data-close></div>
      <div class="reader__sheet" role="dialog" aria-modal="true" aria-labelledby="reader-title">
        <button class="reader__close" type="button" data-close aria-label="Close">&times;</button>
        <h2 class="reader__title" id="reader-title"></h2>
        <div class="reader__body" id="reader-body"></div>
      </div>
    </div>

    <!-- shown only if assets/office.jpg is missing -->
    <div class="missing" id="missing" hidden>
      <div class="missing__card">
        <h1>Almost there</h1>
        <p>Save your office image to:</p>
        <code>assets/office.jpg</code>
        <p class="missing__note">Then refresh. Serve the folder over <code>localhost</code> rather than opening the file directly, so the city lights can be read from the image.</p>
      </div>
    </div>

  </div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
