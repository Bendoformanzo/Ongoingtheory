# ── Add this to your existing netlify.toml (or create it if you don't have one) ──

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/canvas"
  to = "/canvas/index.html"
  status = 200

[[redirects]]
  from = "/canvas/*"
  to = "/canvas/index.html"
  status = 200
